[package]
name = "game"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["wgpu", "audio-cpal"]
wgpu = ["bishop/wgpu", "engine_core/wgpu", "widgets/wgpu"]
browser-web = ["bishop/web-gl"]
audio-cpal = ["bishop/audio-cpal"]

[dependencies]
bishop = { path = "../bishop", default-features = false, features = ["audio"] }
engine_core = { path = "../engine_core", default-features = false }
widgets = { path = "../widgets", default-features = false }
mlua = { version = "0.11.5", features = ["luau", "serde"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.9"
uuid = { version = "1.18", features = ["serde", "v4"] }
log = "0.4"
inventory = "0.3"
rfd = "0.13"
strum = "0.26"
strum_macros = "0.26"
serde_json = "1.0"

[dev-dependencies]
engine_core = { path = "../engine_core", default-features = false, features = ["test-utils"] }
tempfile = "3"

[build-dependencies]
winres = "0.1.12"

[lib]
name = "game_lib"
path = "src/lib.rs"

[[bin]]
name = "game"
path = "src/main.rs"

[[bin]]
name = "game-playtest"
path = "src/playtest_main.rs"

[package.metadata.bundle]
name = "DemoGame"
identifier = "com.bishop.demogame"
version = "0.1.0"
resources = ["games/Demo"] 
category = "Game"
short_description = "A demo game for the bishop engine."
