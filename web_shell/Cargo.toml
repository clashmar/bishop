[package]
name = "web_shell"
version = "0.1.0"
edition = "2024"

[features]
playable-fixture = ["dep:engine_core", "dep:mlua", "dep:ron"]
renderer-proof = ["bishop/web-gl", "dep:serde", "dep:serde_json"]
demo-checkpoint = ["bishop/web-gl", "dep:game_lib", "dep:engine_core", "dep:ron", "dep:serde", "dep:pollster"]

[dependencies]
bishop = { path = "../bishop", default-features = false, features = ["audio"] }
game_lib = { package = "game", path = "../game", default-features = false, features = ["browser-web"], optional = true }
pollster = { version = "0.4", optional = true }
engine_core = { path = "../engine_core", default-features = false, optional = true }
mlua = { version = "0.11.5", features = ["luau", "serde"], optional = true }
ron = { version = "0.9", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
