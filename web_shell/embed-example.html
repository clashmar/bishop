<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bishop game</title>
  <style>
    body { margin: 0; padding: 2rem 1rem; background: #111827; color: #f9fafb; font-family: system-ui, sans-serif; }
    main { max-width: 1024px; margin: auto; }
    button { font: inherit; padding: 0.75rem 1.25rem; }
    iframe { display: block; width: 100%; height: 850px; border: 1px solid #374151; }
  </style>
</head>
<body>
  <main>
    <h1>Bishop game</h1>
    <p>This page only loads Bishop Player after you reveal the game. The player downloads the game after you press Play inside it.</p>
    <button id="reveal" type="button">Reveal game</button>
    <button id="close" type="button" hidden>Close game</button>
    <div id="game-frame"></div>
  </main>
  <script>
    const game = '{{GAME_PATH}}';
    const reveal = document.getElementById('reveal');
    const close = document.getElementById('close');
    const container = document.getElementById('game-frame');
    reveal.addEventListener('click', () => {
      const url = new URL('bishop-player/player.html', location.href);
      url.searchParams.set('game', game);
      const iframe = document.createElement('iframe');
      iframe.src = url.href;
      iframe.title = 'Bishop game player';
      iframe.allow = 'autoplay; fullscreen';
      container.append(iframe);
      reveal.hidden = true;
      close.hidden = false;
    });
    close.addEventListener('click', () => {
      container.replaceChildren();
      close.hidden = true;
      reveal.hidden = false;
      reveal.focus();
    });
  </script>
</body>
</html>
